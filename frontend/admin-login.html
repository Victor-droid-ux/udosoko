<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Admin Login — UDUSOK PG Portal</title>
<link rel="shortcut icon" href="images/udus-logo.svg"/>
<link href="css/bootstrap.min.css" rel="stylesheet"/>
<link href="css/style.css" rel="stylesheet"/>
<style>
body { background: #1a3a6b; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-wrap { width: 400px; background: white; border-radius: 10px; box-shadow: 0 8px 40px rgba(0,0,0,0.3); overflow: hidden; }
.login-header { background: #142d57; color: white; padding: 28px; text-align: center; }
.login-header h2 { margin: 0; font-size: 20px; }
.login-header p { margin: 6px 0 0; font-size: 12px; opacity: 0.7; }
.login-body { padding: 32px; }
.form-group label { font-weight: 600; font-size: 13px; color: #333; }
.form-control { border-radius: 6px; border: 1.5px solid #ddd; padding: 10px 14px; font-size: 14px; width: 100%; margin-bottom: 14px; }
.btn-login { width: 100%; background: #1a3a6b; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
.msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 13px; display: none; }
.msg.error { background: #fdecea; color: #c8331a; display: block; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-header">
    <h2>🔐 Admin Portal</h2>
    <p>UDUSOK Postgraduate Admissions — Staff Only</p>
  </div>
  <div class="login-body">
    <div id="msg" class="msg"></div>
    <div class="form-group">
      <label>Admin Email</label>
      <input type="email" id="email" class="form-control" placeholder="admin@udusok.edu.ng"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" class="form-control" placeholder="Enter password"/>
    </div>
    <button class="btn-login" id="loginBtn" onclick="doAdminLogin()">Login to Admin Panel</button>
  </div>
</div>
<script>
function doAdminLogin() {
  var email    = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var btn      = document.getElementById('loginBtn');
  var msg      = document.getElementById('msg');
  if (!email || !password) { msg.textContent = 'Enter email and password.'; msg.className = 'msg error'; return; }
  btn.disabled = true; btn.textContent = 'Logging in...';
  fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password }),
  })
  .then(r => r.json())
  .then(d => {
    btn.disabled = false; btn.textContent = 'Login to Admin Panel';
    if (d.success) {
      localStorage.setItem('admin_token', d.token);
      localStorage.setItem('admin_user', JSON.stringify(d.admin));
      window.location.href = '/admin';
    } else {
      msg.textContent = d.message || 'Login failed.'; msg.className = 'msg error';
    }
  })
  .catch(() => { btn.disabled = false; btn.textContent = 'Login'; msg.textContent = 'Connection error.'; msg.className = 'msg error'; });
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') doAdminLogin(); });
</script>
</body>
</html>
